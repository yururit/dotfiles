[tasks."setup:link"]
description = "dotfiles を $HOME に symlink する"
run = '''
files=".zshrc .vimrc .vim .gitconfig .pryrc"
# 実ディレクトリがあると ln はその中にリンクを作ってしまうので、張る前に止める
for f in $files; do
  if [ -d "$HOME/$f" ] && [ ! -L "$HOME/$f" ]; then
    echo "$HOME/$f が実ディレクトリです。退避してから再実行してください" >&2
    exit 1
  fi
done
for f in $files; do
  ln -snfv "$PWD/$f" "$HOME/$f"
done
mkdir -p ~/.config/mise
ln -snfv "$PWD/mise/config.toml" ~/.config/mise/config.toml
'''

[tasks."setup:brew"]
description = "Brewfile のパッケージを入れる"
run = "brew bundle --file=Brewfile"

[tasks."setup:vim:plugins"]
description = "vim のプラグインマネージャ（vim-jetpack）を入れる"
# ~/.vim のリンクより先に curl が ~/.vim を作ると、リンクが ~/.vim/.vim にできてしまうため
depends = ["setup:link"]
run = "curl -fLo ~/.vim/pack/jetpack/opt/vim-jetpack/plugin/jetpack.vim --create-dirs https://raw.githubusercontent.com/tani/vim-jetpack/master/plugin/jetpack.vim"

# Claude Code と codex は本体に自動更新の機能があり、mise でバージョンを管理すると衝突するため、公式インストーラで入れる
[tasks."setup:claude"]
description = "Claude Code を入れる"
run = "curl -fsSL https://claude.ai/install.sh | bash"

[tasks."setup:codex"]
description = "codex を入れる"
run = "curl -fsSL https://chatgpt.com/codex/install.sh | sh"

[tasks.setup]
description = "セットアップ一式を実行し、mise で管理するツールを入れる"
depends = ["setup:link", "setup:brew", "setup:vim:plugins", "setup:claude", "setup:codex"]
run = "mise install"
